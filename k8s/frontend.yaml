# E-Mapp frontend (nginx serve static) trên k3s.
# Image build từ Frontend/Dockerfile với VITE_API_URL trỏ về https://<host>/api.
# Apply: k3s kubectl apply -f k8s/frontend.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emapp-frontend
  namespace: emapp
  labels: { app: emapp-frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: emapp-frontend }
  template:
    metadata:
      labels: { app: emapp-frontend }
    spec:
      containers:
        - name: frontend
          image: tubeo78910/emapp-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: emapp-frontend
  namespace: emapp
spec:
  selector: { app: emapp-frontend }
  ports:
    - name: http
      port: 80
      targetPort: 80
